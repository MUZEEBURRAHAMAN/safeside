# XcodeGen spec — generates FoodScanner.xcodeproj (gitignored; never commit it).
# Usage: `cd ios && xcodegen generate`, then open FoodScanner.xcodeproj.
# See ios/README.md for full setup steps (Config.xcconfig, SPM packages, team).

name: FoodScanner

options:
  bundleIdPrefix: io.omnisai
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  # Keeps both real-device (iphoneos) and Simulator (iphonesimulator) builds
  # available — the default SUPPORTED_PLATFORMS; not restricted to either.

# Project-level base configuration. Config.xcconfig defines SUPABASE_URL /
# SUPABASE_ANON_KEY, injected into Info.plist below via $(VAR) substitution.
# Config.xcconfig is gitignored (see ios/README.md); Config-example.xcconfig
# is the tracked template.
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig

# Surface the xcconfig files in the navigator instead of "Recovered References".
fileGroups:
  - Config.xcconfig
  - Config-example.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2" # iPhone + iPad
    CODE_SIGN_STYLE: Automatic
    # Muzeeb's Personal Team (free Apple ID). Swap for a paid-program team ID
    # before TestFlight/App Store. Simulator builds work regardless.
    DEVELOPMENT_TEAM: "JPS4HAKT9Z"
    # Release versioning (TestFlight #3). Bump CURRENT_PROJECT_VERSION on every
    # upload (App Store Connect requires a unique build per version).
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios
    from: "5.0.0"

targets:
  FoodScanner:
    type: application
    platform: iOS
    sources:
      - path: FoodScanner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.omnisai.foodscanner
        PRODUCT_NAME: FoodScanner
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Generated/FoodScanner-Info.plist
      properties:
        CFBundleDisplayName: SafeSide
        NSCameraUsageDescription: "Scan product barcodes and labels to look up ingredients."
        UILaunchScreen: {}
        # Portrait-only on iPhone (Chunk 6): the camera/Result layouts are
        # designed portrait-first — a rotated launch was previously untested
        # (default inherits all orientations). iPad keeps both portrait
        # variants (TARGETED_DEVICE_FAMILY includes iPad).
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        # Bundled display font (Space Grotesk, OFL) — the brand headline/score
        # face per DESIGN_SYSTEM.md §3. Body/UI stays SF Pro (Dynamic Type).
        UIAppFonts:
          - SpaceGrotesk.ttf
        # Injected from Config.xcconfig at build time — never hardcode secrets here.
        SUPABASE_URL: "$(SUPABASE_URL)"
        SUPABASE_ANON_KEY: "$(SUPABASE_ANON_KEY)"
    dependencies:
      - package: Supabase
        product: Supabase
      - package: RevenueCat
        product: RevenueCat

  FoodScannerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FoodScannerTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.omnisai.foodscanner.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: FoodScanner

  FoodScannerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FoodScannerUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.omnisai.foodscanner.uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: FoodScanner

schemes:
  FoodScanner:
    build:
      targets:
        FoodScanner: all
        FoodScannerTests: [test]
        FoodScannerUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FoodScannerTests
        - FoodScannerUITests
