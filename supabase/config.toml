# Supabase CLI configuration — minimal for local development.
# Placeholder project_id; replace after `supabase link` against a real project.
project_id = "foodscanner"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
jwt_expiry = 3600
enable_signup = true
# Anonymous sign-ins power the frictionless first-run experience:
# the iOS client gets an anon JWT (role = authenticated) before any account exists.
enable_anonymous_sign_ins = true

[auth.email]
enable_signup = true
enable_confirmations = false

[edge_runtime]
enabled = true
policy = "oneshot"
